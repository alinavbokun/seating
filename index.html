{"tables":[{"name":"Стол 1","guests":["Светлана Петровна (мать невесты)","Светлана Аркадьевна (мать жениха)","Алексей Олегович (отец жениха)","Виолетта Алексеевна (сестра жениха)","Людмила Михайловна (бабушка жениха)","Владимир Яковлевич (дедушка жениха)","Галина Михайловна (бабушка невесты)"]},{"name":"Стол 2","guests":["Олег Викторович (дедушка жениха)","Зоя Петровна (бабушка жениха)","Юлия Викторовна (тётя жениха)","Анастасия Олеговна (тётя жениха)","Сергей Анатольевич (муж Анастасии О.)","Маргарита Сергеевна (дочь Анастасии О.)","Владислав Аркадьевич (дядя жениха)","Татьяна Михайловна (жена Владислава)","Артемий Владиславович (сын Владислава)"]},{"name":"Стол 3","guests":["Наталья Михайловна (друг семьи жениха)","Дмитрий Николаевич (муж Натальи М.)","Елена Петровна (тётя невесты)","Людмила Станиславовна (жена А. Н.)","Александр Николаевич (друг семьи невесты)","Александр Алексеевич (муж Оксаны)","Оксана Александровна (двоюр. сестра невесты)","Арина Александровна (дочь Оксаны)"]},{"name":"Стол 4","guests":["Иван Владиславович (сын Владислава)","Кирилл Владиславович (сын Владислава)","Наталья Александровна (спутница Кирилла)","Алиса Алексеевна (сестра жениха)","Илья Денисович (друг невесты, универ)","Александр Максимович (друг жениха с детства)","Андрей Германович (друг невесты, универ)","Анастасия Викторовна (подруга невесты, универ)","Никита Александрович (сын Александра Н.)"]},{"name":"Стол 5","guests":["Екатерина Геннадьевна (жена Евгения О.)","Евгений Олегович (друг жениха, учёба)","Виталий Олегович (друг жениха, учёба)","Анастасия Дмитриевна (жена Виталия)","Глеб Петрович (друг жениха, работа)","Ульяна Андреевна (коллега жениха)","Роман Олегович (спутник Ульяны)","Татьяна Александровна (коллега невесты)","Евгений Юрьевич (спутник Татьяны А.)"]},{"name":"Стол 6","guests":["Нина Георгиевна (подруга невесты, школа)","Людмила Викторовна (подруга невесты, школа)","Валентина Юрьевна (подруга невесты, школа)","Андрей Александрович (спутник Валентины)","Дарья Владимировна (коллега невесты)","Алёна Владимировна (коллега невесты)","Евгений Владимирович (муж Катерины)","Катерина Александровна (подруга невесты, универ)","Варвара Евгеньевна (дочь Катерины)"]}],"unseated":["Вячеслав Казимирович (отец невесты)"]}

<style id="css">

  --text:#1d2340; --muted:#6a7090; --chip:#ffffff; --pool:#fff6f7; --ok:#2e7d4f;
  --hand:'Caveat','Segoe Print','Comic Sans MS',cursive;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161a2b; --grid:#232a44; --ink:#9fb2ff; --ink-soft:#7a88c9; --margin:#7a3d48;
  --text:#e6e9f7; --muted:#9aa1c2; --chip:#1f2540; --pool:#2a1f2a;}}
:root[data-theme="dark"]{--paper:#161a2b; --grid:#232a44; --ink:#9fb2ff; --ink-soft:#7a88c9; --margin:#7a3d48;
  --text:#e6e9f7; --muted:#9aa1c2; --chip:#1f2540; --pool:#2a1f2a;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--paper);color:var(--text);font-family:var(--ui);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(4px);border-bottom:2px solid var(--margin);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.status.dirty{color:#c0392b}.status.ok{color:var(--ok)}
main{padding:16px;max-width:1200px;margin:0 auto}

.stage{position:absolute;left:0;top:0;width:420px;height:250px;transform-origin:0 0}

  padding:1px 6px;border-radius:6px;user-select:none;-webkit-user-select:none;touch-action:none;background:transparent}

  padding:2px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translate(-50%,-120%)}
.dragging{opacity:.3}
.chip input,.tname input{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding:0 4px;min-width:6ch}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--paper);border-radius:10px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center}
.toast button{border-color:var(--paper);color:var(--paper)}

.trash{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:none;
  background:#c0392b;color:#fff;border-radius:999px;padding:10px 22px;font-weight:700}
.trash.show{display:block}.trash.over{transform:translateX(-50%) scale(1.1)}
.readonly .chip{cursor:default}
@media (max-width:600px){header{position:static}h1{font-size:1.7rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  header .ctrl,.hint,.add,.trash{display:none!important}
  header{position:static;border:0}
  body{background:#fff}
  .grid{grid-template-columns:1fr 1fr}
  .tablewrap{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>Максим и Алина</h1>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <span class="ctrl status" id="status"></span>
  <button class="ctrl" id="undo" title="Отменить (Ctrl+Z)" disabled="">↶ Отменить</button>
  <button class="ctrl" id="redo" title="Повторить (Ctrl+Shift+Z)" disabled="">↷ Повторить</button>
  <button class="ctrl" id="reset" title="Вернуть последнюю сохранённую версию" disabled="">Сбросить</button>
  <button class="ctrl" id="addTable">+ стол</button>
  <button class="ctrl" id="print">Печать</button>
  <button class="ctrl primary" id="save" disabled="">Сохранить</button>
</header>
<main>
  <div class="head"><span class="couple">Максим ♥ Алина</span></div>
  <p class="hint">Перетаскивай имена между столами и внутри стола, чтобы поменять порядок. Нажми на имя или название стола, чтобы исправить. Чтобы удалить гостя, перетащи его в корзину внизу.</p>
  <section class="pool" id="pool" data-target="pool">
    <h2>Не рассажены</h2>
    <div class="list" id="poolList"></div>
    <div class="add ctrl"><input id="newGuest" placeholder="Добавить гостя…" aria-label="Имя нового гостя"><button id="addGuest">Добавить</button></div>
  </section>
  <div class="grid" id="grid"></div>
</main>
<div class="trash" id="trash">🗑 Удалить</div>

<script id="app">
const initial = JSON.parse(document.getElementById('state').textContent);
const DRAFT_KEY = 'seating-draft-v1';
let state = structuredClone(initial);
let dirty = false, readOnly = false, artifactApi = null;

try { const d = sessionStorage.getItem(DRAFT_KEY) || localStorage.getItem(DRAFT_KEY);
  if (d) { const p = JSON.parse(d); if (p && p.base === JSON.stringify(initial)) { state = p.state; dirty = true; } } } catch(e){}

const $ = id => document.getElementById(id);
const esc = s => s;

function saveDraft(){
  try { const v = JSON.stringify({base: JSON.stringify(initial), state});
    localStorage.setItem(DRAFT_KEY, v); sessionStorage.setItem(DRAFT_KEY, v); } catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); sessionStorage.removeItem(DRAFT_KEY);}catch(e){} }

/* history: every change is a snapshot; kept in sessionStorage so it survives the reload after "Сохранить" */
const HIST_KEY = 'seating-history-v1';
let past = [], future = [], present = JSON.stringify(state);
try { const h = JSON.parse(sessionStorage.getItem(HIST_KEY) || 'null');
  if (h && h.present === present){ past = h.past || []; future = h.future || []; } } catch(e){}
// a draft restored from an earlier visit: make the saved version reachable with «Отменить»
if (!past.length && present !== JSON.stringify(initial)) past = [JSON.stringify(initial)];
function syncDirty(){ dirty = JSON.stringify(state) !== JSON.stringify(initial); dirty ? saveDraft() : clearDraft(); }
function saveHist(){ try { sessionStorage.setItem(HIST_KEY, JSON.stringify({past: past.slice(-100), future, present})); } catch(e){} }
function markDirty(){
  const now = JSON.stringify(state);
  if (now !== present){ past.push(present); future = []; present = now; saveHist(); }
  syncDirty(); renderStatus();
}
function undo(){ if (!past.length) return; future.push(present); present = past.pop(); state = JSON.parse(present); saveHist(); syncDirty(); render(); }
function redo(){ if (!future.length) return; past.push(present); present = future.pop(); state = JSON.parse(present); saveHist(); syncDirty(); render(); }
function renderStatus(){
  const s = $('status'), b = $('save');
  $('reset').disabled = readOnly || !dirty;
  $('undo').disabled = readOnly || !past.length; $('redo').disabled = readOnly || !future.length;
  if (readOnly){ s.textContent = 'только просмотр'; s.className='ctrl status'; b.disabled = true; return; }
  if (dirty){ s.textContent = 'есть несохранённые изменения'; s.className='ctrl status dirty'; b.disabled = false; }
  else { s.textContent = 'сохранено'; s.className='ctrl status ok'; b.disabled = true; }
}

const R = 160, W = 2*R + 20, CY = R + 20;
// guests sit on the outer half of the table: left column faces left, right column faces right
function layout(n, i, left){
  const cx = left ? W - 10 - R : 10 + R;
  const dy = n > 1 ? R*0.9*(-1 + 2*i/(n-1)) : 0;
  const dx = Math.sqrt(R*R - dy*dy);
  return {cx, px: left ? cx - dx : cx + dx, py: CY + dy};
}
function chip(name, where, idx){
  const el = document.createElement('div');
  el.className = 'chip'; el.tabIndex = 0; el.dataset.name = name;
  const m = name.match(/^(.*?)\s*\((.+)\)\s*$/);
  if (m){ el.append(m[1]); const r = document.createElement('small'); r.textContent = m[2]; el.append(r); }
  else el.textContent = name;
  el.dataset.where = where; el.dataset.idx = idx;
  el.addEventListener('pointerdown', startDrag);
  return el;
}

function render(){
  const seated = state.tables.reduce((s,t)=>s+t.guests.length,0);
  $('stats').textContent = `за столами ${seated}, не рассажены ${state.unseated.length}, всего с вами ${seated + state.unseated.length + 2}`;
  const pl = $('poolList'); pl.innerHTML = '';
  if (!state.unseated.length){ const e=document.createElement('span'); e.className='empty'; e.textContent='Все рассажены'; pl.append(e); }
  state.unseated.forEach((g,i)=>pl.append(chip(g,'pool',i)));

  const grid = $('grid'); grid.innerHTML = '';
  state.tables.forEach((t,ti)=>{
    const wrap = document.createElement('div'); wrap.className='tablewrap'; wrap.dataset.target = ti;
    const stage = document.createElement('div'); stage.className='stage'; stage.style.width = W+'px'; stage.style.height = (2*CY)+'px';
    const c = document.createElement('div'); c.className='circle';
    const tn = document.createElement('button'); tn.className='tname'; tn.textContent=t.name; tn.title='Нажми, чтобы переименовать';
    tn.addEventListener('click',()=>renameTable(ti, tn));
    const cnt = document.createElement('div'); cnt.className='cnt'; cnt.textContent = `${t.guests.length} чел.`;
    c.append(tn,cnt); stage.append(c);
    const left = ti % 2 === 0;
    c.style.left = (layout(1,0,left).cx - R) + 'px'; c.style.width = c.style.height = (2*R) + 'px';
    t.guests.forEach((g,gi)=>{
      const {px,py} = layout(t.guests.length, gi, left);
      const dot = document.createElement('div'); dot.className='seat'; dot.style.left=px+'px'; dot.style.top=py+'px';
      const ch = chip(g, ti, gi);
      ch.style.top = py+'px'; ch.style.transform = 'translateY(-50%)';
      if (left){ ch.style.right = (W-px+8)+'px'; ch.classList.add('l'); } else ch.style.left = (px+8)+'px';
      stage.append(dot, ch);
    });
    wrap.append(stage); grid.append(wrap);
  });
  fit(); renderStatus();
}
function fit(){ document.querySelectorAll('.tablewrap').forEach(w=>{
  const st = w.firstChild; let x0 = 0, x1 = W, y0 = 0, y1 = 2*CY;
  st.querySelectorAll('.chip').forEach(c=>{ const t = c.offsetTop - c.offsetHeight/2;
    x0 = Math.min(x0, c.offsetLeft); x1 = Math.max(x1, c.offsetLeft + c.offsetWidth);
    y0 = Math.min(y0, t); y1 = Math.max(y1, t + c.offsetHeight); });
  const k = w.clientWidth / (x1 - x0);
  st.style.transform = `scale(${k}) translate(${-x0}px,${-y0}px)`;
  w.style.aspectRatio = 'auto'; w.style.height = ((y1 - y0) * k) + 'px';
}); }
window.addEventListener('resize', fit);
try { document.fonts.ready.then(fit); document.fonts.addEventListener('loadingdone', fit); } catch(e){}

/* drag via pointer events (mouse + touch) */
let drag = null;
function startDrag(e){
  if (readOnly || e.button > 0 || e.target.tagName === 'INPUT') return;
  const el = e.currentTarget;
  drag = {el, where: el.dataset.where, idx: +el.dataset.idx, name: el.dataset.name, x0:e.clientX, y0:e.clientY, moved:false, ghost:null, over:null};
  el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove', moveDrag); el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', cancelDrag);
}
function targetAt(x,y){
  const els = document.elementsFromPoint(x,y);
  for (const n of els){ if (n.id==='trash') return 'trash'; const t = n.closest && n.closest('[data-target]'); if (t) return t; }
  return null;
}
function moveDrag(e){
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 6) return;
  if (!drag.moved){ drag.moved = true; drag.el.classList.add('dragging');
    drag.ghost = document.createElement('div'); drag.ghost.className='ghost'; drag.ghost.textContent = drag.name; document.body.append(drag.ghost);
    $('trash').classList.add('show'); }
  drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
  const t = targetAt(e.clientX,e.clientY);
  if (t !== drag.over){
    if (drag.over && drag.over !== 'trash') drag.over.classList.remove('over');
    $('trash').classList.toggle('over', t==='trash');
    if (t && t !== 'trash') t.classList.add('over');
    drag.over = t;
  }
  updateInsert(e.clientY);
  const m = 60; if (e.clientY < m) scrollBy(0,-12); else if (e.clientY > innerHeight-m) scrollBy(0,12);
}
function updateInsert(y){
  document.querySelectorAll('.insert').forEach(n=>n.remove());
  const w = drag.over; drag.insertAt = null;
  if (!w || w === 'trash' || w.dataset.target === 'pool') return;
  const chips = [...w.querySelectorAll('.chip')].filter(c => c !== drag.el).map(c => c.getBoundingClientRect());
  let idx = chips.filter(r => (r.top + r.bottom)/2 < y).length;
  drag.insertAt = idx;
  const wr = w.getBoundingClientRect();
  let yy;
  if (!chips.length) yy = wr.top + wr.height/2;
  else if (idx === 0) yy = chips[0].top - 1;
  else if (idx === chips.length) yy = chips[idx-1].bottom + 1;
  else yy = (chips[idx-1].bottom + chips[idx].top)/2;
  const left = +w.dataset.target % 2 === 0;
  const line = document.createElement('div'); line.className = 'insert';
  line.style.top = (yy - wr.top - 1) + 'px';
  line.style.left = left ? '0' : '50%'; line.style.width = '50%';
  w.append(line);
}
function cleanup(){
  if (!drag) return;
  drag.el.classList.remove('dragging'); drag.ghost && drag.ghost.remove();
  if (drag.over && drag.over!=='trash') drag.over.classList.remove('over');
  $('trash').classList.remove('show','over');
  document.querySelectorAll('.insert').forEach(n=>n.remove());
  drag.el.removeEventListener('pointermove', moveDrag); drag.el.removeEventListener('pointerup', endDrag); drag.el.removeEventListener('pointercancel', cancelDrag);
}
function cancelDrag(){ cleanup(); drag = null; }
function listOf(where){ return where==='pool' ? state.unseated : state.tables[+where].guests; }
function endDrag(){
  if (!drag) return; const d = drag; cleanup(); drag = null;
  if (!d.moved){ rename(d.where, d.idx, d.el); return; }
  if (!d.over) return;
  if (d.over === 'trash'){
    listOf(d.where).splice(d.idx,1); markDirty(); render();
    toast(`«${d.name}» удалён(а)`, undo); return;
  }
  const to = d.over.dataset.target;
  const at = d.insertAt == null ? listOf(to).length : d.insertAt;
  if (String(to) === String(d.where) && (to === 'pool' || at === d.idx)) return;
  listOf(d.where).splice(d.idx,1); listOf(to).splice(at,0,d.name); markDirty(); render();
}

function inlineEdit(host, value, commit){
  if (host.querySelector('input')) return;
  const inp = document.createElement('input'); inp.value = value; inp.size = Math.max(value.length, 6);
  host.textContent = ''; host.append(inp); inp.focus(); inp.select();
  let done = false;
  const finish = ok => { if (done) return; done = true; const v = inp.value.trim();
    if (ok && v && v !== value){ commit(v); markDirty(); } render(); };
  inp.addEventListener('input', () => inp.size = Math.max(inp.value.length, 6));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}
function rename(where, idx, el){

let toastTimer = null;
function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(n => n.remove()); clearTimeout(toastTimer);
  const t = document.createElement('div'); t.className = 'toast';
  const span = document.createElement('span'); span.textContent = msg;
  const b = document.createElement('button'); b.textContent = 'Вернуть';
  b.onclick = () => { t.remove(); undo(); };
  t.append(span, b); document.body.append(t);
  toastTimer = setTimeout(() => t.remove(), 6000);
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if ((k === 'z' || k === 'я') && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (((k === 'z' || k === 'я') && e.shiftKey) || k === 'y' || k === 'н'){ e.preventDefault(); redo(); }
});


/* GitHub-backed shared saving */
const GH_API = 'https://api.github.com/repos/alinavbokun/seating/contents/index.html';
try { const m = location.hash.match(/[#&]t=([^&]+)/); if (m){ localStorage.setItem('gh-token', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); } } catch(e){}
function ghToken(){ try { return localStorage.getItem('gh-token'); } catch(e){ return null; } }
function ghHeaders(t){ const h = { 'Accept': 'application/vnd.github+json' }; if (t) h['Authorization'] = 'Bearer ' + t; return h; }
function b64ToText(b){ const bin = atob(b.replace(/\s/g,'')); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
function textToB64(t){ const bytes = new TextEncoder().encode(t); let bin=''; for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
function stateOf(html){ const m = html.match(/<script id="state" type="application\/json">([\s\S]*?)<\/script>/); return m ? JSON.parse(m[1]) : null; }
function setInitial(st){ for (const k of Object.keys(initial)) delete initial[k]; Object.assign(initial, structuredClone(st)); }
async function ghFetchLatest(){
  const r = await fetch(GH_API + '?ref=main&_=' + Date.now(), { headers: ghHeaders(ghToken()), cache: 'no-store' });
  if (!r.ok) throw { status: r.status };
  const j = await r.json(); return { sha: j.sha, state: stateOf(b64ToText(j.content)) };
}
(async () => {
  if (window.claude) return;
  try {
    const { state: remote } = await ghFetchLatest();
    if (remote && JSON.stringify(remote) !== JSON.stringify(initial) && !dirty){
      setInitial(remote); state = structuredClone(remote); past = []; future = []; present = JSON.stringify(state); render(); renderStatus();
    }
  } catch(e){}
})();
/* persistence: publish a new version of this page with the state embedded */
$('save').onclick = async () => {
  if (!dirty) return;
  const clean = SOURCE.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b)=> a + '\n' + JSON.stringify(state).replace(/</g,'\\u003c') + '\n' + b);
  if (!artifactApi){
    let token = ghToken();
    if (!token){
      token = (prompt('Код доступа для сохранения (вводится один раз):') || '').trim();
      if (!token) return;
    }
    $('save').disabled = true; $('status').textContent = 'сохраняю…';
    const h = ghHeaders(token);
    try {
      const cur = await fetch(GH_API + '?ref=main&_=' + Date.now(), { headers: h, cache: 'no-store' });
      if (cur.status === 401 || cur.status === 403 || cur.status === 404) throw { auth: true };
      if (!cur.ok) throw new Error('get ' + cur.status);
      const j = await cur.json();
      const remote = stateOf(b64ToText(j.content));
      if (remote && JSON.stringify(remote) !== JSON.stringify(initial)) throw { conflict: true };
      const put = await fetch(GH_API, { method: 'PUT', headers: h, body: JSON.stringify({ message: 'рассадка: обновление', content: textToB64(clean), sha: j.sha, branch: 'main' }) });
      if (put.status === 401 || put.status === 403) throw { auth: true };
      if (put.status === 409) throw { conflict: true };
      if (!put.ok) throw new Error('put ' + put.status);
      try { localStorage.setItem('gh-token', token); } catch(e){}
      setInitial(state); syncDirty(); renderStatus();
      $('status').textContent = 'сохранено для всех';
    } catch (err) {
      if (err && err.auth){ try { localStorage.removeItem('gh-token'); } catch(e){} $('status').textContent = 'код не подошёл, нажми «Сохранить» ещё раз'; }
      else if (err && err.conflict){ $('status').textContent = 'кто-то уже сохранил свои правки — обнови страницу и повтори'; }
      else { $('status').textContent = 'не удалось сохранить, попробуй ещё раз'; }
      $('save').disabled = false;
    }
    return;
  }
  $('save').disabled = true; $('status').textContent = 'сохраняю…';
  try { await artifactApi.publish(clean); clearDraft(); }
  catch(err){
    if (err && (err.code==='not_writer' || err.code==='not_granted')){ readOnly = true; document.body.classList.add('readonly'); }
    else if (err && err.code==='conflict'){ /* page reloads to the latest version */ }
    else { $('status').textContent = 'не удалось сохранить, попробуй ещё раз'; $('save').disabled = false; return; }
    renderStatus();
  }
};

const SOURCE = (() => {
  // snapshot of the page as authored, taken before render() touches the DOM
  const root = document.documentElement.cloneNode(true);
  root.querySelectorAll('script').forEach(n => { if (n.id !== 'state' && n.id !== 'app') n.remove(); });
  root.querySelectorAll('style').forEach(n => { if (n.id !== 'css') n.remove(); });
  root.querySelectorAll('link').forEach(n => { if (!/fonts\.googleapis/.test(n.href || '')) n.remove(); });
  root.removeAttribute('data-theme'); root.removeAttribute('style');
  return '<!doctype html>\n' + root.outerHTML;
})();
(async () => {
  try { if (window.claude && claude.use){ artifactApi = await claude.use('artifact'); } } catch(e){}

})();
